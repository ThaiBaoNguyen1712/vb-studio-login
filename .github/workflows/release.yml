name: Build & Release VB-STUDIO

on:
  push:
    tags:
      - 'v*' # Trigger khi push tag dạng v1.0.0, v1.0.1,...
  workflow_dispatch: # Cho phép bấm chạy thủ công từ GitHub UI

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile `
            --name "VB-STUDIO" `
            --icon "src\web\assets\app.ico" `
            --paths "." `
            --paths "src" `
            --add-data "src\web;src\web" `
            --add-data "assets;assets" `
            --hidden-import webview `
            --hidden-import playwright `
            --hidden-import packaging `
            --hidden-import packaging.version `
            --hidden-import cryptography `
            --hidden-import pyzipper `
            --hidden-import psycopg2 `
            --hidden-import src `
            --collect-submodules webview `
            --collect-submodules packaging `
            --collect-submodules src `
            run.py


      - name: Prepare Release Package
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "latest" }
          New-Item -ItemType Directory -Force -Path "release_pkg" | Out-Null
          Copy-Item "dist\VB-STUDIO.exe" "release_pkg\"
          Copy-Item ".env.example" "release_pkg\"
          
          # Nén thành file zip phân phối cho user
          Compress-Archive -Path "release_pkg\*" -DestinationPath "dist\VB-STUDIO-$tag-win64.zip" -Force

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/VB-STUDIO.exe
            dist/VB-STUDIO-*-win64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
